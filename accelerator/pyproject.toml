[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ternip-accel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "safetensors>=0.4", "huggingface-hub>=0.23", "tokenizers>=0.19"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.1", "pyslang==9.1.0"]
export = ["torch==2.4.0"]
quality = ["datasets==2.19.2", "torch==2.4.0", "transformers==4.40.2", "einops==0.8.0", "setuptools==70.0.0", "packaging==24.2", "triton==3.0.0; platform_system == 'Linux'"]

[project.scripts]
ternip-accel = "ternip_accel.cli:main"

[tool.setuptools]
packages = ["ternip_accel"]
